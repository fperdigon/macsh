name: Release

# - Push a tag like v0.1.3     -> builds DMGs and publishes a regular GitHub Release.
# - Any new commit on main     -> builds DMGs and refreshes the rolling "nightly"
#   (merged PRs and direct pushes alike)  pre-release.
# - Manual run                 -> same as a push to the selected branch.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/macsh/Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Info.plist version ${version}"
            exit 1
          fi

      - name: Run tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build DMGs
        run: ./scripts/build-release.sh

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Publish nightly pre-release
        if: github.ref_type != 'tag'
        run: |
          short="${GITHUB_SHA::7}"
          day="$(date -u +%Y-%m-%d)"
          for f in dist/*.dmg; do
            mv "$f" "${f%.dmg}-nightly-${day}-${short}.dmg"
          done
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/*.dmg \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ${day} (${short})" \
            --notes "Automated build of \`main\` at ${short}. Unsigned and unstable; use a tagged release unless you want the latest changes."
