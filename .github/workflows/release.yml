name: Release

# - Push a tag like v0.1.3  -> builds DMGs and publishes a regular GitHub Release.
# - Every night (and on demand) -> builds the latest main and refreshes the
#   rolling "nightly" pre-release. Skipped when main has no new commits.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Is there anything new to build?
        id: gate
        if: github.event_name == 'schedule'
        run: |
          last="$(gh api "repos/${{ github.repository }}/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Nightly already built from $GITHUB_SHA; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/macsh/Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Info.plist version ${version}"
            exit 1
          fi

      - name: Run tests
        if: steps.gate.outputs.skip != 'true'
        run: swift test

      - name: Install xcodegen
        if: steps.gate.outputs.skip != 'true'
        run: brew install xcodegen

      - name: Build DMGs
        if: steps.gate.outputs.skip != 'true'
        run: ./scripts/build-release.sh

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag

      - name: Publish nightly pre-release
        if: github.ref_type != 'tag' && steps.gate.outputs.skip != 'true'
        run: |
          short="${GITHUB_SHA::7}"
          day="$(date -u +%Y-%m-%d)"
          for f in dist/*.dmg; do
            mv "$f" "${f%.dmg}-nightly-${day}-${short}.dmg"
          done
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/*.dmg \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ${day} (${short})" \
            --notes "Automated build of \`main\` at ${short}. Unsigned and unstable; use a tagged release unless you want the latest changes."
