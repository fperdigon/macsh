name: Release

# - Push a tag like v0.1.3     -> builds DMGs and publishes a regular GitHub Release.
# - Any new commit on main     -> builds DMGs and refreshes the rolling "nightly"
#   (merged PRs and direct pushes alike)  pre-release.
# - Manual run                 -> same as a push to the selected branch.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to list changes since the last release

      - name: Check tag matches app version
        if: github.ref_type == 'tag'
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/macsh/Resources/Info.plist)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Info.plist version ${version}"
            exit 1
          fi

      - name: Xcode version
        run: xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build DMGs
        run: ./scripts/build-release.sh

      - name: Disk usage after build
        if: always()
        run: df -h /

      - name: Publish tagged release
        if: github.ref_type == 'tag'
        run: |
          prev_tag="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            if [ -n "$prev_tag" ]; then
              echo "## Changes since ${prev_tag}"
            else
              echo "## Changes"
            fi
            echo
            ./scripts/release-notes.sh "$prev_tag" "$GITHUB_REF_NAME"
            if [ -n "$prev_tag" ]; then
              echo
              echo "**Full diff:** https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

      - name: Publish nightly pre-release
        if: github.ref_type != 'tag'
        run: |
          short="${GITHUB_SHA::7}"
          day="$(date -u +%Y-%m-%d)"

          # The nightly release is recreated every build, so carry its change history
          # forward: read the previous body, find what it was built from, and prepend
          # this build's commits to the accumulated list.
          prev_body="$(gh release view nightly --json body --jq .body 2>/dev/null || true)"
          prev_sha="$(printf '%s\n' "$prev_body" | sed -n 's/.*nightly-sha: \([0-9a-f]\{40\}\).*/\1/p' | head -n 1)"
          prev_history="$(printf '%s\n' "$prev_body" | sed -n '/<!-- history -->/,$p' | tail -n +2)"
          if [ -z "$prev_sha" ]; then
            prev_sha="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
          fi

          {
            echo "Automated build of \`main\` at ${short}. Unsigned and unstable; use a tagged release unless you want the latest changes."
            echo "<!-- nightly-sha: ${GITHUB_SHA} -->"
            echo
            echo "## Changes (newest first)"
            echo "<!-- history -->"
            echo "### ${day} (${short})"
            ./scripts/release-notes.sh "$prev_sha" "$GITHUB_SHA"
            if [ -n "$prev_history" ]; then
              echo
              printf '%s\n' "$prev_history"
            fi
          } | head -c 100000 > notes.md

          for f in dist/*.dmg; do
            mv "$f" "${f%.dmg}-nightly-${day}-${short}.dmg"
          done
          gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
          gh release create nightly dist/*.dmg \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nightly ${day} (${short})" \
            --notes-file notes.md
